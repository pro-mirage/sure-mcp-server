services:
  sure-mcp-server:
    build: .
    image: sure-mcp-server:latest
    container_name: sure-mcp-server
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - SURE_API_URL=${SURE_API_URL:-http://host.docker.internal:3000}
      - SURE_API_KEY=${SURE_API_KEY:-}
      - SURE_ACCESS_TOKEN=${SURE_ACCESS_TOKEN:-}
      - SURE_TIMEOUT=${SURE_TIMEOUT:-30}
      - SURE_VERIFY_SSL=${SURE_VERIFY_SSL:-false}
      - MCP_HOST=0.0.0.0
      - PORT=${PORT:-8000}
      - MCP_PATH=${MCP_PATH:-/mcp}
      - MCP_JSON_RESPONSE=${MCP_JSON_RESPONSE:-true}
      - MCP_STATELESS_HTTP=${MCP_STATELESS_HTTP:-true}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
